# Optional: Render "Blueprint" for the API. Create it via New > Blueprint.
services:
  - type: web
    name: sankofa-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false        # paste your MongoDB Atlas connection string
      - key: CLIENT_ORIGIN
        sync: false        # your deployed frontend URL, e.g. https://sankofa-goods.vercel.app
